<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vincent Lin — Game Programmer / Technical Artist</title>
<meta name="description" content="An enthusiastic game programmer bridging artistic vision with technical implementation across Unreal Engine and Unity. Currently building immersive experiences at Nimbus Games.">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#09080A;--bg2:#111018;--bg3:#1A1720;--border:#28242E;
  --text:#E5DDD0;--dim:#8A7E70;--dimmer:#4A443E;
  --accent:#C8A96E;--adim:rgba(200,169,110,.13);
  --green:#7CB99A;--blue:#7CA8B9;--purple:#A89BD4;--orange:#C89A6E;
  --mono:"Space Mono",monospace;--sans:"Plus Jakarta Sans","Noto Sans JP",sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}

#page{height:100%;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;position:relative;z-index:0}
#page::-webkit-scrollbar{width:4px}
#page::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

#cv{position:fixed;inset:0;z-index:1;pointer-events:none}
#grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.038;
  background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjY1IiBudW1PY3RhdmVzPSIzIiBzdGl0Y2hUaWxlcz0ic3RpdGNoIi8+PGZlQ29sb3JNYXRyaXggdHlwZT0ic2F0dXJhdGUiIHZhbHVlcz0iMCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIiBmaWx0ZXI9InVybCgjbikiIG9wYWNpdHk9Ii40Ii8+PC9zdmc+");
  animation:grn .22s steps(1) infinite}
@keyframes grn{0%{transform:translate(0,0)}33%{transform:translate(-2%,-3%)}66%{transform:translate(3%,1%)}100%{transform:translate(-1%,2%)}}

#loader{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;padding:9vh 9vw;overflow:hidden}
#loader.out{animation:lWipe .75s cubic-bezier(.77,0,.18,1) both}
@keyframes lWipe{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 0 100% 0)}}
#ja-bg{position:absolute;inset:0;pointer-events:none;font-family:var(--mono);font-size:.66rem;line-height:1.72;color:rgba(255,255,255,.022);padding:1rem;word-break:break-all;overflow:hidden}
.l-eye{font-family:var(--mono);font-size:.54rem;letter-spacing:.3em;color:rgba(255,255,255,.22);margin-bottom:1rem;position:relative;z-index:1}
.l-name{font-family:var(--mono);font-size:clamp(1.8rem,5.5vw,4.2rem);font-weight:700;color:#fff;letter-spacing:-.02em;line-height:1;margin-bottom:.4rem;position:relative;z-index:1}
.l-role{font-family:var(--mono);font-size:clamp(.58rem,1.3vw,.78rem);color:rgba(255,255,255,.26);letter-spacing:.18em;position:relative;z-index:1}
.l-spacer{flex:1}
.l-msgs{margin-bottom:2rem;position:relative;z-index:1}
.l-msg{font-family:var(--mono);font-size:.6rem;color:rgba(255,255,255,.28);line-height:2.1;opacity:0;animation:mIn .1s ease both;letter-spacing:.04em}
.l-msg::before{content:"> ";color:rgba(255,255,255,.14)}
@keyframes mIn{to{opacity:1}}
.l-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:2rem;position:relative;z-index:1}
.l-ba{flex:1;max-width:380px}
.l-cnt{font-family:var(--mono);font-size:.52rem;color:rgba(255,255,255,.22);letter-spacing:.15em;margin-bottom:.55rem}
.l-bar{height:1px;background:rgba(255,255,255,.08)}
.l-fill{height:1px;width:0;background:rgba(255,255,255,.78);transition:width .35s ease}
.l-wel{font-family:var(--mono);font-size:.52rem;letter-spacing:.28em;color:rgba(255,255,255,0);transition:color .7s;text-transform:uppercase}
.l-wel.show{color:rgba(255,255,255,.35)}

#nav{position:fixed;top:0;left:0;right:0;z-index:500;height:48px;
  display:flex;align-items:center;justify-content:space-between;padding:0 1.6rem;gap:1rem;
  transition:background .4s,border-color .4s}
#nav.solid{background:rgba(9,8,10,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.nav-logo{font-family:var(--mono);font-size:.76rem;font-weight:700;letter-spacing:.12em;cursor:pointer;white-space:nowrap}
.nav-links{display:flex;gap:1.5rem;align-items:center}
.nav-link{font-family:var(--mono);font-size:.6rem;color:rgba(255,255,255,.45);letter-spacing:.08em;cursor:pointer;transition:color .2s;position:relative;white-space:nowrap}
.nav-link:hover,.nav-link.active{color:var(--text)}
.nav-link.active::after{content:"";position:absolute;bottom:-4px;left:0;right:0;height:1px;background:var(--accent)}
.nav-r{display:flex;align-items:center;gap:.65rem;flex-shrink:0}
.nav-resume,.nav-contact{font-family:var(--mono);font-size:.58rem;letter-spacing:.06em;padding:.3rem .75rem;border-radius:5px;cursor:pointer;transition:all .2s;white-space:nowrap;display:inline-flex;align-items:center;gap:.35rem}
.nav-resume{color:var(--dim);border:1px solid var(--border)}
.nav-resume:hover{color:var(--text);border-color:rgba(255,255,255,.28)}
.nav-contact{color:var(--bg);background:var(--accent);border:1px solid var(--accent);font-weight:700}
.nav-contact:hover{opacity:.88}
.nav-mute{font-size:.88rem;opacity:.55;cursor:pointer;padding:.2rem .35rem}
.nav-mute:hover{opacity:1}

#s-hero{height:100vh;display:flex;flex-direction:column;overflow:hidden;scroll-snap-align:start;position:relative}
.hero-bg{position:absolute;inset:0;z-index:0}
.bg-glow{position:absolute;border-radius:50%;filter:blur(120px);pointer-events:none}
.bg-g1{width:60vw;height:60vh;top:-10vh;left:5%;background:rgba(168,155,212,.03);animation:gl 18s ease-in-out infinite alternate}
.bg-g2{width:50vw;height:50vh;bottom:-5vh;right:2%;background:rgba(200,169,110,.028);animation:gl 24s ease-in-out 5s infinite alternate-reverse}
@keyframes gl{from{transform:scale(1)}to{transform:scale(1.2) translate(3%,-4%)}}
.hero-bg-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.22;pointer-events:none;z-index:0}
.hero-content{position:relative;z-index:3;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 2rem;margin-top:48px}
.hero-eyebrow{font-family:var(--mono);font-size:.6rem;letter-spacing:.35em;color:rgba(255,255,255,.28);margin-bottom:1.5rem}
.hero-name{font-family:var(--mono);font-size:clamp(3rem,9vw,6.8rem);font-weight:700;color:#fff;letter-spacing:-.02em;line-height:1;margin-bottom:.55rem}
.hero-jp{font-family:var(--sans);font-size:clamp(.9rem,2vw,1.25rem);font-weight:300;color:rgba(255,255,255,.28);letter-spacing:.35em;margin-bottom:.75rem}
.hero-role{font-family:var(--mono);font-size:clamp(.66rem,1.4vw,.85rem);color:rgba(255,255,255,.42);letter-spacing:.18em}
.hero-scroll{position:relative;z-index:3;padding:0 0 2rem;display:flex;flex-direction:column;align-items:center;gap:.55rem}
.scroll-label{font-family:var(--mono);font-size:.5rem;letter-spacing:.25em;color:rgba(255,255,255,.28);text-transform:uppercase}
.scroll-line{width:1px;height:36px;background:linear-gradient(to bottom,rgba(255,255,255,.35),transparent)}

#s-desk{height:100vh;overflow:hidden;scroll-snap-align:start;position:relative}
#wins{position:absolute;inset:0;z-index:10}
.win{position:absolute;display:flex;flex-direction:column;background:rgba(17,16,24,.96);backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:10px;box-shadow:0 24px 72px rgba(0,0,0,.9);min-width:220px;min-height:130px;user-select:none}
.win.focus{border-color:rgba(200,169,110,.32)}
.win.gone{display:none}
.wbar{height:34px;background:rgba(22,20,30,.98);border-radius:10px 10px 0 0;border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 .8rem;cursor:move;flex-shrink:0;position:relative}
.wdots{display:flex;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;cursor:pointer}
.dr{background:#FF5F57}.dy{background:#FFBD2E}.dg{background:#28C840}
.wtitle{position:absolute;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:.62rem;font-weight:700;color:var(--dim)}
.wbody{flex:1;overflow:auto;border-radius:0 0 10px 10px}
.wbody::-webkit-scrollbar{width:3px}
.wbody::-webkit-scrollbar-thumb{background:var(--border)}
.wrsz{position:absolute;bottom:0;right:0;width:14px;height:14px;cursor:se-resize}

.tc{padding:.9rem 1.1rem;font-family:var(--mono);font-size:.7rem;line-height:1.85}
.tl{display:block;white-space:pre-wrap}
.kw{color:var(--purple)}.fn{color:var(--blue)}.st{color:var(--green)}.nm{color:var(--orange)}.cm{color:var(--dimmer);font-style:italic}.dk{color:var(--dim)}
.cli-wrap{margin-top:.65rem;padding-top:.65rem;border-top:1px solid var(--border)}
.cli-row{display:flex;align-items:center;gap:.4rem;font-family:var(--mono);font-size:.68rem}
.cli-prompt{color:var(--accent)}
.cli-input{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:var(--mono);font-size:.68rem}

.ab{padding:1.05rem}
.ab-top{display:flex;gap:.8rem;align-items:flex-start;margin-bottom:.8rem}
.ab-av{width:56px;height:56px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.ab-av img{width:100%;height:100%;object-fit:cover}
.ab-name{font-family:var(--mono);font-size:.86rem;font-weight:700;margin-bottom:.15rem}
.ab-role{font-family:var(--mono);font-size:.58rem;color:var(--dim);line-height:1.6}
.ab-bio{font-size:.78rem;color:var(--dim);line-height:1.72;margin-bottom:.8rem}
.ab-div{height:1px;background:var(--border);margin:.75rem 0}
.ab-lnks{display:flex;flex-wrap:wrap;gap:.75rem}
.ab-lnk{font-family:var(--mono);font-size:.6rem;color:var(--dim)}
.ab-lnk:hover{color:var(--accent)}

.exp-wrap{padding:.95rem 1.05rem}
.exp-item{margin-bottom:1rem;padding-bottom:.9rem;border-bottom:1px solid rgba(255,255,255,.05)}
.exp-item:last-child{border-bottom:none}
.exp-yr{font-family:var(--mono);font-size:.56rem;color:var(--dimmer);margin-bottom:.2rem}
.exp-org{font-family:var(--mono);font-size:.76rem;font-weight:700}
.exp-role{font-family:var(--mono);font-size:.58rem;color:var(--accent);margin:.12rem 0 .28rem}
.exp-desc{font-size:.74rem;color:var(--dim);line-height:1.6}
.exp-tags{font-family:var(--mono);font-size:.54rem;color:var(--dimmer);margin-top:.32rem}

.sk-wrap{position:relative;width:100%;height:100%;overflow:hidden}
.sk-chip{position:absolute;left:0;top:0;font-family:var(--mono);font-size:.58rem;padding:.2rem .6rem;border-radius:20px;background:rgba(255,255,255,.05);color:var(--dim);border:1px solid rgba(255,255,255,.08);cursor:grab;white-space:nowrap;user-select:none}
.sk-chip.held{border-color:var(--accent);color:var(--accent);background:var(--adim);z-index:99}
.sk-cat-lbl{position:absolute;font-family:var(--mono);font-size:.5rem;letter-spacing:.12em;color:var(--dimmer);text-transform:uppercase;pointer-events:none}

.exp-tb{padding:.44rem .82rem;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:.54rem;color:var(--dim);display:flex;align-items:center;justify-content:space-between}
.exp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:.55rem;padding:.75rem}
.ffile{display:flex;flex-direction:column;overflow:hidden;border-radius:9px;border:1px solid var(--border);background:#14121B;cursor:pointer;position:relative;transition:transform .25s,border-color .25s,box-shadow .25s}
.ffile:hover{transform:translateY(-3px);border-color:rgba(200,169,110,.7);box-shadow:0 10px 26px rgba(0,0,0,.65)}
.ffile.feat{border-color:rgba(200,169,110,.5);box-shadow:0 6px 24px rgba(200,169,110,.14)}
.ff-cov{height:58px;width:100%;position:relative;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.06);background:#0D0C12;display:flex;align-items:center;justify-content:center}
.ff-cov img{width:100%;height:100%;object-fit:cover;opacity:.75;transition:transform .4s,opacity .4s}
.ffile:hover .ff-cov img{transform:scale(1.08);opacity:1}
.ff-body{padding:.55rem .65rem;display:flex;flex-direction:column;gap:.25rem;flex:1}
.ff-icon{font-size:1.35rem}
.ff-name{font-family:var(--mono);font-size:.66rem;font-weight:700;color:var(--text)}
.ffile:hover .ff-name{color:var(--accent)}
.ff-yr{font-family:var(--mono);font-size:.54rem;color:var(--dim)}
.ff-cta{margin-top:.3rem;padding-top:.3rem;border-top:1px solid rgba(255,255,255,.05);display:flex;justify-content:space-between;font-family:var(--mono);font-size:.52rem;color:var(--dim)}
.ffile:hover .ff-cta span:last-child{color:var(--accent)}
.ff-latest{position:absolute;top:5px;right:5px;font-family:var(--mono);font-size:.46rem;color:var(--accent);font-weight:700;background:rgba(9,8,10,.85);padding:2px 5px;border-radius:4px}
.ps-ref-link{display:inline-flex;align-items:center;gap:2px;margin:0 2px;padding:1px 6px;border-radius:4px;border-bottom:1px solid rgba(200,169,110,.75);background:rgba(200,169,110,.15);color:var(--accent);font-weight:600;cursor:pointer;transition:background .2s}
.ps-ref-link:hover{background:rgba(200,169,110,.28)}

#map-wrap{height:100%;width:100%;position:relative}
#lmap{height:100%;width:100%}
.map-pin{position:absolute;bottom:8px;left:8px;z-index:999;font-family:var(--mono);font-size:.56rem;background:rgba(9,8,10,.9);padding:.25rem .58rem;border-radius:4px;border:1px solid var(--border);color:var(--text);display:inline-flex;align-items:center;gap:5px;transition:border-color .2s,color .2s}
.map-pin:hover{border-color:rgba(200,169,110,.7);color:var(--accent)}

#social{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:1rem;z-index:20}
.sb-lnk{font-family:var(--mono);font-size:.58rem;color:var(--dim)}
.sb-lnk:hover{color:var(--accent)}
#dock{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(14,12,18,.92);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:13px;padding:.36rem .52rem;display:flex;gap:.25rem;z-index:20}
.dki{display:flex;flex-direction:column;align-items:center;gap:2px;padding:.24rem .45rem;border-radius:7px;cursor:pointer}
.dki:hover{background:rgba(255,255,255,.06)}
.dki.on{background:var(--adim)}
.dki-ico{font-size:1.15rem}
.dki-lbl{font-family:var(--mono);font-size:.45rem;color:var(--dim)}

#s-art{min-height:100vh;background:var(--bg);padding:5.5rem 5% 4rem;scroll-snap-align:start}
.art-header{text-align:center;margin-bottom:3rem}
.art-eyebrow{font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;color:var(--accent);margin-bottom:.6rem}
.art-title{font-family:var(--mono);font-size:clamp(1.4rem,4vw,2.2rem);font-weight:700;margin-bottom:.5rem}
.art-sub{font-size:.85rem;color:var(--dim)}
.art-grid{columns:3 240px;gap:1.15rem;max-width:1100px;margin:0 auto}
.art-item{break-inside:avoid;margin-bottom:1.15rem;cursor:pointer;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:var(--bg2);transition:border-color .2s,transform .2s}
.art-item:hover{border-color:rgba(200,169,110,.45);transform:translateY(-2px)}
.art-item img,.art-item video{width:100%;display:block}
.art-cap{padding:.65rem .8rem}
.art-cap-t{font-family:var(--mono);font-size:.64rem}
.art-cap-m{font-family:var(--mono);font-size:.54rem;color:var(--dim);margin-top:.15rem}
.art-footer{max-width:1100px;margin:4rem auto 0;padding-top:2rem;border-top:1px solid var(--border);display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.art-footer-copy{font-family:var(--mono);font-size:.58rem;color:var(--dimmer)}
.art-footer-links{display:flex;gap:1.2rem}
.art-fl{font-family:var(--mono);font-size:.6rem;color:var(--dim)}
.art-fl:hover{color:var(--accent)}

#po{position:fixed;inset:0;z-index:800;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .48s cubic-bezier(.77,0,.18,1)}
#po.open{transform:translateY(0)}
.po-bar{position:sticky;top:0;background:rgba(9,8,10,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:.75rem 5%;z-index:10}
.po-back,.po-nb{font-family:var(--mono);font-size:.64rem;color:var(--dim)}
.po-back:hover,.po-nb:hover{color:var(--text)}
.po-content{max-width:920px;margin:0 auto;padding:2.5rem 5% 5rem}
.po-title{font-family:var(--mono);font-size:clamp(1.4rem,3.5vw,2.1rem);font-weight:700;margin-bottom:.5rem}
.po-meta{font-family:var(--mono);font-size:.64rem;color:var(--dim);margin-bottom:.85rem}
.po-links{display:flex;gap:.9rem;margin-top:.75rem}
.po-lnk{font-family:var(--mono);font-size:.64rem;color:var(--accent)}
.ps-h2-wrap{margin:2.5rem 0 .85rem;border-left:2px solid var(--accent);padding-left:.85rem}
.ps-h2-eye{font-family:var(--mono);font-size:.55rem;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;margin-bottom:.2rem}
.ps-h2{font-family:var(--mono);font-size:clamp(1.15rem,2.6vw,1.6rem);font-weight:700;color:var(--text)}
.ps-h3{font-family:var(--mono);font-size:.9rem;font-weight:700;color:var(--accent);margin:1.75rem 0 .65rem;padding-bottom:.4rem;border-bottom:1px solid var(--border)}
.ps-p{font-size:.9rem;color:var(--dim);line-height:1.78;margin-bottom:.85rem;white-space:pre-line}
.ps-p strong,.ps-ul strong{color:var(--text);font-weight:600}
.ps-ic{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:.86em;color:var(--green)}
.ps-ul{font-size:.88rem;color:var(--dim);line-height:1.8;padding-left:1.25rem;margin-bottom:.9rem}
.ps-fig{margin:1.15rem 0}
.ps-fig img,.ps-fig video{width:100%;border-radius:8px;border:1px solid var(--border);display:block}
figcaption{font-family:var(--mono);font-size:.58rem;color:var(--dimmer);margin-top:.4rem;text-align:center}
.ps-yt{position:relative;padding-bottom:56.25%;height:0;margin:1.15rem 0;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.ps-yt iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.ps-code{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:1rem;margin:.9rem 0;overflow-x:auto;font-family:var(--mono);font-size:.7rem;color:var(--green)}
.ps-hr{border:none;border-top:1px solid var(--border);margin:1.8rem 0}
.ps-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem;margin:1rem 0}
.ps-gallery.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:640px){.ps-gallery,.ps-gallery.cols-3{grid-template-columns:1fr}}
.ps-gallery img,.ps-gallery video{width:100%;border-radius:6px;border:1px solid var(--border);cursor:pointer}
.ps-gallery figcaption{white-space:pre-line}
.ps-split{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;align-items:center;margin:1.25rem 0}
@media(max-width:700px){.ps-split{grid-template-columns:1fr}}
.ps-callout{margin:1.15rem 0;padding:1rem 1.15rem;border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:0 10px 10px 0;background:rgba(200,169,110,.06)}
.ps-callout-lbl{font-family:var(--mono);font-size:.54rem;font-weight:700;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;margin-bottom:.25rem}
.ps-callout-ttl{font-family:var(--mono);font-size:.8rem;font-weight:700;color:var(--text);margin-bottom:.3rem}

          "subtitle": "Light, Dark & Rotation Modes",
          "content": "The player’s hand tools feature 3 distinct modes: **Light Mode** shoots out a beam to input light onto sensors, **Dark Mode** projects a dark cone that absorbs light from light assets, and **Rotation Mode** allows the player to rotate world puzzle objects by a fixed angle.",

          "mediaCaption": "Negative Light — Distance-scaled 3D cone mesh simulating an inverse flashlight"
        },

          "id": "ol_callout_neglight",
          "type": "callout",
          "tone": "blue",
          "label": "TROUBLESHOOTING & TRADE-OFF",
          "title": "Why I Rejected Forced Negative IES Intensity for the 3D Cone Mesh",
          "content": "Before settling on the 3D cone mesh, I discovered another workaround (`IES_light` capture above): overriding UE4’s **IES lighting intensity scale to a negative value** manually—even though Unreal Engine normally prevents negative intensities. While it realistically absorbed ambient light from surfaces, it proved **unstable, performance-intensive**, and lacked the **3D volumetric beam look** required—making the distance-scaling 3D cone material the cleaner shipping solution."

let pts=[],mouse={x:-999,y:-999},isDragging=false;
function initParticles(){const cv=document.getElementById('cv'),cx=cv.getContext('2d');const rs=()=>{cv.width=innerWidth;cv.height=innerHeight;};rs();addEventListener('resize',rs);pts=Array.from({length:60},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,r:Math.random()*1.1+.35,al:Math.random()*.26+.07,col:Math.random()>.5?'#A89BD4':'#C8A96E'}));const rip=[];window.emitShockwave=(x,y,str=1.5)=>{pts.forEach(p=>{const dx=p.x-x,dy=p.y-y,d=Math.hypot(dx,dy);if(d<180&&d>0){const f=str*(1-d/180);p.vx+=dx/d*f;p.vy+=dy/d*f;}});rip.push({x,y,r:0,al:.35,sp:5});};function draw(){cx.clearRect(0,0,cv.width,cv.height);pts.forEach(p=>{const dx=p.x-mouse.x,dy=p.y-mouse.y,d=Math.hypot(dx,dy);if(d<100&&d>0){const f=(1-d/100)*(isDragging?2:.55);p.vx+=dx/d*f*.16;p.vy+=dy/d*f*.16;}p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>cv.width)p.vx*=-1;if(p.y<0||p.y>cv.height)p.vy*=-1;cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fillStyle=p.col;cx.globalAlpha=p.al;cx.fill();});for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.hypot(dx,dy);if(d<100){cx.beginPath();cx.moveTo(pts[i].x,pts[i].y);cx.lineTo(pts[j].x,pts[j].y);cx.strokeStyle='#A89BD4';cx.globalAlpha=(1-d/100)*.05;cx.lineWidth=.4;cx.stroke();}}for(let i=rip.length-1;i>=0;i--){const rp=rip[i];cx.beginPath();cx.arc(rp.x,rp.y,rp.r,0,Math.PI*2);cx.strokeStyle='rgba(200,169,110,'+rp.al+')';cx.lineWidth=.8;cx.globalAlpha=1;cx.stroke();rp.r+=rp.sp;rp.al*=.87;if(rp.al<.01)rip.splice(i,1);}cx.globalAlpha=1;requestAnimationFrame(draw);}draw();document.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});}

let autoSnapUntil=0,prevSy=0;

function runLoader(){
  const TOTAL=18;document.getElementById('l-name').textContent=CONFIG.name.toUpperCase();document.getElementById('l-role').textContent=CONFIG.role.toUpperCase();
  document.getElementById('ja-bg').textContent=('開発者ポートフォリオウェブゲームプログラミング技術創造　').repeat(450);
  const msgsEl=document.getElementById('l-msgs'),fi=document.getElementById('l-fill'),ci=document.getElementById('l-cnt'),we=document.getElementById('l-wel');
  let idx=0;
  function next(){
    if(idx>=CONFIG.loadMsgs.length){
      we.classList.add('show');

        document.getElementById('loader').classList.add('out');
        setTimeout(()=>{
          document.getElementById('loader').style.display='none';
          page.style.display='block';
          initParticles();populateSite();
          const obs=new IntersectionObserver(es=>{if(es[0].isIntersecting&&!deskBuilt){deskBuilt=true;buildDesktop();}},{threshold:.12});
          obs.observe(document.getElementById('s-desk'));
          if(CONFIG.bgMusicUrl){const m=document.getElementById('bg-music');m.src=CONFIG.bgMusicUrl;m.volume=.25;document.addEventListener('click',()=>m.play().catch(()=>{}),{once:true});}
        },720);

    }

    const p=(idx+1)/CONFIG.loadMsgs.length;fi.style.width=p*100+'%';ci.textContent='Assets : '+Math.round(p*TOTAL)+' / '+TOTAL;idx++;setTimeout(next,340);

    const s=document.createElement('span');s.className='nav-link';s.textContent=cp.navLabel||cp.title;s.onclick=()=>openCustomPage(cp.id);navLinks.appendChild(s);

  }).join('');
  page.addEventListener('scroll',()=>{
    const sy=page.scrollTop,dir=sy>prevSy?1:sy<prevSy?-1:0;prevSy=sy;
    document.getElementById('nav').classList.toggle('solid',sy>60);
    let act='s-hero';['s-hero','s-desk','s-art'].forEach(id=>{const el=document.getElementById(id);if(el&&el.offsetTop-90<=sy)act=id;});
    document.querySelectorAll('.nav-link[data-sec]').forEach(l=>l.classList.toggle('active',l.dataset.sec===act));
    if(innerWidth>=768&&dir!==0&&Date.now()>autoSnapUntil&&!document.getElementById('po').classList.contains('open')&&!document.getElementById('lb').classList.contains('open')){
      const dEl=document.getElementById('s-desk'),aEl=document.getElementById('s-art');
      if(dEl&&aEl){

        if(dir===1){
          if(sy>=th&&sy<dTop-th){autoSnapUntil=Date.now()+720;page.scrollTo({top:dTop,behavior:'smooth'});}
          else if(sy>=dTop+th&&sy<aTop-th){autoSnapUntil=Date.now()+720;page.scrollTo({top:aTop,behavior:'smooth'});}
        }else{
          if(sy<=dTop-th&&sy>th){autoSnapUntil=Date.now()+720;page.scrollTo({top:0,behavior:'smooth'});}
          else if(sy<=aTop-th&&sy>dTop+th){autoSnapUntil=Date.now()+720;page.scrollTo({top:dTop,behavior:'smooth'});}
        }
      }
    }
  });
}

let Z=10;
function getLayout(id){
  const W=Math.max(innerWidth,1024),H=Math.max(innerHeight,660);
  const top=54,bot=96,availH=H-top-bot,pad=18;
  const col1=Math.min(440,Math.floor(W*0.33)),col2=Math.min(340,Math.floor(W*0.25)),col3=Math.max(280,W-col1-col2-pad*4);
  const row1=Math.floor(availH*0.46),row2=availH-row1-14;
  const map={
    terminal:{x:pad,y:top,w:col1,h:row1},
    about:{x:pad*2+col1,y:top,w:col2,h:row1},
    experience:{x:pad*3+col1+col2,y:top,w:col3,h:row1},
    skills:{x:pad,y:top+row1+14,w:col1,h:row2},
    projects:{x:pad*2+col1,y:top+row1+14,w:Math.floor((col2+col3+pad)*0.62),h:row2},
    map:{x:pad*3+col1+Math.floor((col2+col3+pad)*0.62),y:top+row1+14,w:Math.max(220,(col2+col3+pad)-Math.floor((col2+col3+pad)*0.62)-pad),h:row2}

}

    bar.addEventListener('mousedown',e=>{if(e.target.classList.contains('dot'))return;on=true;isDragging=true;const desk=document.getElementById('s-desk').getBoundingClientRect();ox=e.clientX-el.offsetLeft;oy=e.clientY-(el.offsetTop+desk.top);focusW(id);emitShockwave(e.clientX,e.clientY,1.8);SFX.play('tab');});
    document.addEventListener('mousemove',e=>{if(!on)return;const desk=document.getElementById('s-desk');const dr=desk.getBoundingClientRect();el.style.left=Math.max(0,Math.min(desk.offsetWidth-el.offsetWidth,e.clientX-ox))+'px';el.style.top=Math.max(48,Math.min(desk.offsetHeight-el.offsetHeight,e.clientY-dr.top-oy))+'px';});

function buildTerminal(){
  mkWin('terminal',CONFIG.name+'.js','<div class="tc" id="tc"></div>');

    if(i>=CONFIG.code.length){
      out.insertAdjacentHTML('beforeend','<div class="cli-wrap"><div id="cli-log"></div><div class="cli-row"><span class="cli-prompt">vincent@nimbus:~$</span><input class="cli-input" id="cli-in" placeholder="type help, ls, open chiyo..." autocomplete="off"></div></div>');
      const inp=document.getElementById('cli-in'),log=document.getElementById('cli-log');
      inp.addEventListener('keydown',e=>{
        if(e.key!=='Enter')return;
        const raw=inp.value.trim(),cmd=raw.toLowerCase();inp.value='';if(!raw)return;
        let res='';
        if(cmd==='help')res='Commands: ls, open <project>, cat about, skills, art, clear';

        else if(cmd==='cat about')res=CONFIG.bio;

        else{const ee=CONFIG.passcodes.find(p=>p.code===raw.toUpperCase());if(ee){showEgg(ee);res='Passcode accepted!';}else res='Unknown command. Try "help".';}

    }

}

function initPhysics(){

    zones=[{cat:CONFIG.skills[0]?.cat,x1:PAD,y1:PAD,x2:PAD+cw,y2:PAD+rh},{cat:CONFIG.skills[1]?.cat,x1:PAD*2+cw,y1:PAD,x2:PAD*2+cw*2,y2:PAD+rh},{cat:CONFIG.skills[2]?.cat,x1:PAD,y1:PAD*2+rh,x2:PAD+cw,y2:PAD*2+rh*2},{cat:CONFIG.skills[3]?.cat,x1:PAD*2+cw,y1:PAD*2+rh,x2:PAD*2+cw*2,y2:PAD*2+rh*2}];
    wrap.querySelectorAll('.sk-zone-box,.sk-cat-lbl').forEach(n=>n.remove());
    zones.forEach(z=>{if(!z.cat)return;const bg=document.createElement('div');bg.className='sk-zone-box';bg.style.cssText='position:absolute;left:'+z.x1+'px;top:'+z.y1+'px;width:'+(z.x2-z.x1)+'px;height:'+(z.y2-z.y1)+'px;border:1px solid rgba(255,255,255,.05);border-radius:7px;pointer-events:none';wrap.appendChild(bg);const lbl=document.createElement('div');lbl.className='sk-cat-lbl';lbl.textContent=z.cat;lbl.style.cssText='left:'+(z.x1+7)+'px;top:'+(z.y1+5)+'px';wrap.appendChild(lbl);});
    chips.forEach(c=>{const z=zones.find(zz=>zz.cat===c.cat);if(z){c.zone={x1:z.x1+2,y1:z.y1+LH,x2:z.x2-2,y2:z.y2-4};}});
  }
  calcZones();
  new ResizeObserver(calcZones).observe(wrap);
  CONFIG.skills.forEach(cat=>{
    const z=zones.find(zz=>zz.cat===cat.cat);if(!z)return;
    cat.items.forEach(name=>{
      const el=document.createElement('div');el.className='sk-chip';el.textContent=name;wrap.appendChild(el);
      const w=Math.max(el.offsetWidth||60,56),h=el.offsetHeight||24;
      chips.push({el,cat:cat.cat,x:z.x1+w/2+10+Math.random()*Math.max(10,z.x2-z.x1-w-20),y:z.y1+LH+h/2+Math.random()*Math.max(10,z.y2-z.y1-LH-h-8),vx:(Math.random()-.5)*.6,vy:(Math.random()-.5)*.6,w,h,r:Math.max(w,h)/2+2,held:false,zone:{x1:z.x1+2,y1:z.y1+LH,x2:z.x2-2,y2:z.y2-4}});
    });
  });
  let held=null,ox=0,oy=0;
  const grab=(lx,ly)=>{for(let i=chips.length-1;i>=0;i--){const c=chips[i];if(Math.abs(lx-c.x)<c.w/2+6&&Math.abs(ly-c.y)<c.h/2+6){held=c;c.held=true;c.el.classList.add('held');ox=lx-c.x;oy=ly-c.y;break;}}};
  const move=(lx,ly)=>{if(!held)return;const z=held.zone;held.x=Math.max(z.x1+held.w/2,Math.min(z.x2-held.w/2,lx-ox));held.y=Math.max(z.y1+held.h/2,Math.min(z.y2-held.h/2,ly-oy));held.vx=0;held.vy=0;};
  const rel=()=>{if(held){held.held=false;held.el.classList.remove('held');held=null;}};
  wrap.addEventListener('mousedown',e=>{const r=wrap.getBoundingClientRect();grab(e.clientX-r.left,e.clientY-r.top);});
  document.addEventListener('mousemove',e=>{if(!held)return;const r=wrap.getBoundingClientRect();move(e.clientX-r.left,e.clientY-r.top);});
  document.addEventListener('mouseup',rel);
  (function tick(){chips.forEach((a,i)=>{if(!a.held){a.vx*=.82;a.vy*=.82;a.x+=a.vx;a.y+=a.vy;const z=a.zone,hw=a.w/2+2,hh=a.h/2+2;if(a.x-hw<z.x1){a.x=z.x1+hw;a.vx=Math.abs(a.vx)*.5;}if(a.x+hw>z.x2){a.x=z.x2-hw;a.vx=-Math.abs(a.vx)*.5;}if(a.y-hh<z.y1){a.y=z.y1+hh;a.vy=Math.abs(a.vy)*.5;}if(a.y+hh>z.y2){a.y=z.y2-hh;a.vy=-Math.abs(a.vy)*.5;}}for(let j=i+1;j<chips.length;j++){const b=chips[j];if(a.cat!==b.cat)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r+b.r-2;if(d<min&&d>0){const f=(min-d)/min*.45,nx=dx/d,ny=dy/d;if(!a.held){a.vx-=nx*f;a.vy-=ny*f;}if(!b.held){b.vx+=nx*f;b.vy+=ny*f;}}}a.el.style.transform='translate('+(a.x-a.w/2)+'px,'+(a.y-a.h/2)+'px)';});requestAnimationFrame(tick);})();
}

let mapDone=false;
function initMap(){if(mapDone)return;mapDone=true;setTimeout(()=>{const m=L.map('lmap',{zoomControl:false,attributionControl:false}).setView([CONFIG.location.lat,CONFIG.location.lng],9);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:16}).addTo(m);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{maxZoom:16}).addTo(m);L.circle([CONFIG.location.lat,CONFIG.location.lng],{radius:14000,color:'#C8A96E',weight:1.5,dashArray:'4 4',fillColor:'#C8A96E',fillOpacity:.16}).addTo(m);m.invalidateSize();},180);}

function renderRichText(txt,excludeId){
  const raw=String(txt||'');
  const others=CONFIG.projects.filter(p=>p.id!==excludeId&&p.title).sort((a,b)=>b.title.length-a.title.length);
  const parts=['\\[\\[([^\\]|]+)(?:\\|([^\\]]+))?\\]\\]','\\[([^\\]]+)\\]\\((https?:\/\/[^\\s)]+)\\)','\\*\\*([^*]+)\\*\\*','\\u0060([^\\u0060]+)\\u0060'];
  if(others.length)parts.push('\\b('+others.map(p=>p.title.replace(/[.*+?^$(){}|[\]\\]/g,'\\$&')).join('|')+')\\b');
  const re=new RegExp(parts.join('|'),'gi');
  let out='',last=0,m;
  while((m=re.exec(raw))!==null){
    if(m.index>last)out+=esc(raw.slice(last,m.index));
    if(m[1]){
      const t=CONFIG.projects.find(p=>p.id===m[1].trim());
      out+=t?'<button class="ps-ref-link" onclick="openProj(\''+esc(t.id)+'\')">'+esc((m[2]||t.title).trim())+' ↗</button>':esc(m[0]);
    }else if(m[3]&&m[4]){
      out+='<a class="ps-ext-link" href="'+esc(m[4])+'" target="_blank" rel="noreferrer">'+esc(m[3])+' ↗</a>';
    }else if(m[5]){
      out+='<strong>'+esc(m[5])+'</strong>';
    }else if(m[6]){
      out+='<code class="ps-ic">'+esc(m[6])+'</code>';
    }else if(m[7]){
      const t=others.find(p=>p.title.toLowerCase()===m[7].toLowerCase());
      out+=t?'<button class="ps-ref-link" onclick="openProj(\''+esc(t.id)+'\')">'+esc(m[7])+' ↗</button>':esc(m[0]);
    }
    last=re.lastIndex;
  }
  if(last<raw.length)out+=esc(raw.slice(last));
  return out;
}
function renderSec(s,excludeId){
  switch(s.type){
    case 'heading':return '<div class="ps-h2-wrap">'+(s.eyebrow?'<div class="ps-h2-eye">'+esc(s.eyebrow)+'</div>':'')+'<h2 class="ps-h2">'+esc(s.text)+'</h2></div>';
    case 'subheading':return '<h3 class="ps-h3">● '+esc(s.text)+'</h3>';
    case 'text':return '<p class="ps-p">'+renderRichText(s.content,excludeId)+'</p>';
    case 'list':return '<ul class="ps-ul">'+s.items.map(i=>'<li>'+renderRichText(i,excludeId)+'</li>').join('')+'</ul>';
    case 'callout':return '<div class="ps-callout"><div class="ps-callout-lbl">'+esc(s.label)+'</div><div class="ps-callout-ttl">'+esc(s.title)+'</div><p class="ps-p" style="margin:0">'+renderRichText(s.content,excludeId)+'</p></div>';
    case 'split':{
      if(s.layout==='media-pair'&&s.media2){
        return '<div class="ps-split"><figure>'+renderMediaTag(s.media,s.mediaCaption||'')+(s.mediaCaption?'<figcaption>'+esc(s.mediaCaption)+'</figcaption>':'')+'</figure><figure>'+renderMediaTag(s.media2,s.media2Caption||'')+(s.media2Caption?'<figcaption>'+esc(s.media2Caption)+'</figcaption>':'')+'</figure></div>';
      }
      const txtCol='<div>'+(s.subtitle?'<div style="font-family:var(--mono);font-size:.82rem;font-weight:700;color:var(--text);margin-bottom:.4rem">'+esc(s.subtitle)+'</div>':'')+'<p class="ps-p" style="margin:0">'+renderRichText(s.content||'',excludeId)+'</p></div>';
      const medCol='<figure>'+renderMediaTag(s.media,s.mediaCaption||'')+(s.mediaCaption?'<figcaption>'+esc(s.mediaCaption)+'</figcaption>':'')+'</figure>';
      return '<div class="ps-split">'+(s.layout==='media-left'?medCol+txtCol:txtCol+medCol)+'</div>';
    }
    case 'extRef':{
      const ok=s.url&&!s.url.startsWith('REPLACE')&&!s.url.startsWith('#');
      const wrapTag=ok?'a href="'+esc(s.url)+'" target="_blank" rel="noreferrer"':'div';
      return '<'+wrapTag+' style="display:flex;align-items:center;gap:1rem;margin:1.15rem 0;padding:1rem;border-radius:10px;border:1px solid rgba(124,168,185,.38);background:#11151E"><div style="font-size:1.35rem;color:var(--blue)">🔗</div><div style="flex:1;min-width:0"><div style="font-family:var(--mono);font-size:.72rem;font-weight:700;color:var(--blue)">'+esc(s.source||'Reference')+' · <span style="color:var(--text)">'+esc(s.title)+'</span>'+(ok?' ↗':'')+'</div>'+(s.note?'<div style="font-size:.76rem;color:var(--dim);margin-top:.2rem">'+renderRichText(s.note,excludeId)+'</div>':'')+'</div></'+(ok?'a':'div')+'>';
    }
    case 'image':case 'gif':case 'mp4':return '<figure class="ps-fig">'+renderMediaTag(s.src,s.caption||'')+(s.caption?'<figcaption>'+esc(s.caption)+'</figcaption>':'')+'</figure>';
    case 'youtube':{const id=ytId(s.videoId);return id&&!id.startsWith('REPLACE')?'<div class="ps-yt"><iframe src="https://www.youtube.com/embed/'+esc(id)+'?rel=0" allowfullscreen></iframe></div>':'<div class="ps-code">YouTube video placeholder: set a valid YouTube ID or URL</div>';}
    case 'code':return '<pre class="ps-code"><code>'+esc(s.content)+'</code></pre>';
    case 'divider':return '<hr class="ps-hr">';
    case 'projectRef':{const target=CONFIG.projects.find(p=>p.id===s.projectId);if(!target)return '';return '<div onclick="openProj(\''+esc(target.id)+'\')" style="cursor:pointer;margin:1.15rem 0;padding:1rem;border-radius:8px;border:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;gap:1rem"><div style="font-size:1.75rem">'+target.icon+'</div><div style="flex:1;min-width:0"><div style="font-family:var(--mono);font-size:.74rem;font-weight:700;color:var(--accent)">'+esc(target.title)+' · '+esc(target.engine)+' ↗</div><div style="font-size:.76rem;color:var(--dim);margin-top:.2rem">'+esc(s.note||target.desc)+'</div></div></div>';}
    case 'gallery':{const cls=s.cols===3?'ps-gallery cols-3':'ps-gallery';return '<figure class="ps-fig"><div class="'+cls+'">'+(s.images||[]).map((u,idx)=>'<div>'+renderMediaTag(u,(s.captions&&s.captions[idx])||s.caption||'')+(s.captions&&s.captions[idx]?'<figcaption>'+renderRichText(s.captions[idx],excludeId)+'</figcaption>':'')+'</div>').join('')+'</div>'+(s.caption?'<figcaption style="margin-top:.6rem">'+esc(s.caption)+'</figcaption>':'')+'</figure>';}
    default:return '';
  }
}

let curProj=null;
function openProj(id){
  const p=CONFIG.projects.find(x=>x.id===id);if(!p)return;curProj=id;SFX.play('open');
  const idx=CONFIG.projects.findIndex(x=>x.id===id);
  document.getElementById('po-prev').disabled=idx===0;document.getElementById('po-next').disabled=idx===CONFIG.projects.length-1;
  const links=Object.entries(p.links||{}).map(([k,v])=>'<a class="po-lnk" href="'+esc(v)+'" target="_blank">'+esc(k)+' ↗</a>').join('');
  document.getElementById('po-content').innerHTML='<div style="margin-bottom:2rem"><div class="po-title">'+p.icon+' '+esc(p.title)+'</div><div class="po-meta">'+esc(p.engine)+' · '+esc(p.platform)+' · '+esc(p.year)+' · '+(p.status==='done'?'Completed':'In Progress')+'</div>'+(links?'<div class="po-links">'+links+'</div>':'')+'</div>'+p.sections.map(s=>renderSec(s,p.id)).join('');
  const po=document.getElementById('po');po.classList.add('open');po.scrollTo({top:0,behavior:'smooth'});
}
function openCustomPage(id){
  const cp=(CONFIG.customPages||[]).find(x=>x.id===id);if(!cp)return;curProj=null;SFX.play('open');
  document.getElementById('po-content').innerHTML='<div style="margin-bottom:2rem"><div class="po-title">'+(cp.icon||'📄')+' '+esc(cp.title)+'</div><div class="po-meta">'+esc(cp.subtitle)+'</div></div>'+cp.sections.map(s=>renderSec(s,null)).join('');
  const po=document.getElementById('po');po.classList.add('open');po.scrollTo({top:0,behavior:'smooth'});
}
function closeProj(){SFX.play('close');document.getElementById('po').classList.remove('open');curProj=null;}
function navProj(d){if(!curProj)return;const i=CONFIG.projects.findIndex(x=>x.id===curProj);const n=CONFIG.projects[i+d];if(n)openProj(n.id);}

function openArtLb(i){
  const a=CONFIG.art[i];if(!a)return;const yt=ytId(a.youtubeId||'');const box=document.getElementById('lb-inner');
  if(yt&&!yt.startsWith('REPLACE'))box.innerHTML='<div style="width:100%;max-width:860px;aspect-ratio:16/9"><iframe style="width:100%;height:100%;border:none;border-radius:8px" src="https://www.youtube.com/embed/'+esc(yt)+'?autoplay=1&rel=0" allowfullscreen></iframe></div>';
  else if(isMp4(a.src))box.innerHTML='<video src="'+esc(a.src)+'" controls autoplay loop playsinline></video>';
  else box.innerHTML=renderMediaTag(a.src,a.title,'');
  document.getElementById('lb-cap').textContent=a.title+' · '+a.medium+' · '+a.year;
  document.getElementById('lb').classList.add('open');
}
function closeLb(){document.getElementById('lb').classList.remove('open');document.getElementById('lb-inner').innerHTML='';}

let pcBuf='';
function showEgg(m){SFX.play('easter');document.getElementById('ee-icon').textContent=m.emoji;document.getElementById('ee-title').textContent=m.title;document.getElementById('ee-sub').textContent=m.subtitle;document.getElementById('egg').classList.add('open');}
function closeEgg(){document.getElementById('egg').classList.remove('open');}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeLb();closeEgg();}
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.ctrlKey||e.altKey||e.metaKey||e.key.length>1)return;
  pcBuf=(pcBuf+e.key.toUpperCase()).slice(-20);
  const m=CONFIG.passcodes.find(p=>pcBuf.endsWith(p.code));
  if(m){pcBuf='';showEgg(m);}
});

runLoader();
